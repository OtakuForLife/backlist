services:
  backlist:
    build: .
    image: backlist
    container_name: backlist
    ports:
      - "8080:8080"
    environment:
      PUID: "99"
      PGID: "100"
      INPUT_DIR: /input
      OUTPUT_DIR: /output
      APPDATA_DIR: /appdata
    volumes:
      - ./data/input:/input
      - ./data/output:/output
      - ./data/appdata:/appdata
    restart: unless-stopped
